
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app2
  template:
    metadata:
      labels:
        app: app2
    spec:
      containers:
      - name: nginx
        image: a6h15hek/nginx-cicd-app2:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
